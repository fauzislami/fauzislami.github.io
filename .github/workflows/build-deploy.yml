name: Build and Publish

# NOTE: the `push` trigger is temporarily disabled below (see comment) for
# initial inspection of this recovered site before it goes live. Once
# you've inspected a dry run and are ready for every future push to `master`
# to auto-publish to `gh-pages`, uncomment the `push:` block.
on:
  # push:
  #   branches: [master]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'dry-run'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.152.2'
          extended: true

      - name: Build site
        run: hugo --minify

      - name: Upload build artifact (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: hugo-build-output
          path: public/
          retention-days: 7

      - name: Publish to gh-pages
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages-publish origin/gh-pages
          rsync -a --delete --exclude='.git' public/ /tmp/gh-pages-publish/
          cd /tmp/gh-pages-publish
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Publish site from master@${GITHUB_SHA}"
            git push origin HEAD:gh-pages
          fi
